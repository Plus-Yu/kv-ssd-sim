[build-system]
requires = ["setuptools>=78,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "kv-ssd-sim"
version = "0.1.0"
description = "CPU-only native vLLM scheduler and Mooncake storage emulation prototype"
requires-python = ">=3.13,<3.14"
dependencies = ["mooncake-transfer-engine-non-cuda==0.3.14", "numpy==2.4.6"]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "ruff>=0.17,<0.18"]
http = ["aiohttp==3.14.5"]

[project.scripts]
kv-ssd-sim = "kv_ssd_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires native vLLM and Mooncake runtimes"]

[tool.ruff]
target-version = "py313"
line-length = 100

